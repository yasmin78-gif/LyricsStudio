[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics-studio"
dynamic = ["version"]
description = "Lokales Lyrics Studio mit Desktop-Projektverwaltung"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
lyrics-studio = "lyrics_studio.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[tool.setuptools]
packages = ["lyrics_studio", "lyrics_editor"]
py-modules = ["lyrics_sync"]

[tool.setuptools.package-data]
lyrics_editor = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "lyrics_studio.__version__"}
